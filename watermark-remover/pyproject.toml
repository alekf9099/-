[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmremover"
version = "1.0.0"
description = "PDF·DOCX·PPTX·XLSX·이미지 워터마크 제거 도구"
requires-python = ">=3.10"
dependencies = ["pikepdf>=9.0", "PyMuPDF>=1.24", "opencv-python-headless>=4.9", "numpy>=1.26",
                "lxml>=5.0", "python-pptx>=1.0", "openpyxl>=3.1", "Flask>=3.0"]

[project.optional-dependencies]
test = ["pytest", "python-docx"]

[project.scripts]
wmremove = "wmremover.cli:main"
wmremove-web = "wmremover.web.app:main"

[tool.setuptools.packages.find]
include = ["wmremover*"]

[tool.setuptools.package-data]
"wmremover.web" = ["templates/*.html"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
